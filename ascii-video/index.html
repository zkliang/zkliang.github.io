<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频转字符艺术 - FreeNav 好玩工具</title>

<style>
  :root{
    --bg:#0a0e14; --panel:#11161f; --line:#1e2630; --txt:#c9d4e0;
    --dim:#6b7888; --accent:#00ff41; --accent2:#ffb000;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  header{
    padding:13px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .left{display:flex; align-items:center; gap:14px; min-width:0;}
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header h1 span{color:var(--accent);}
  .back{font-size:13px; color:var(--dim); text-decoration:none; white-space:nowrap; border:1px solid var(--line); padding:4px 10px; border-radius:20px;}
  .back:hover{color:var(--accent); border-color:var(--accent);}
  .badge{font-size:11px; color:var(--accent2); border:1px solid var(--accent2); padding:2px 7px; border-radius:20px; white-space:nowrap;}
  .wrap{display:flex; min-height:calc(100vh - 52px - 47px);}
  .panel{
    width:300px; flex:0 0 300px; background:var(--panel);
    border-right:1px solid var(--line); padding:18px; overflow-y:auto;
  }
  .stage{flex:1; display:flex; align-items:center; justify-content:center; padding:20px; position:relative;}
  #display{
    width:100%; max-width:100%; height:auto; image-rendering:pixelated;
    background:#000; border:1px solid var(--line); border-radius:6px;
    touch-action:none; cursor:crosshair;
  }
  .group{margin-bottom:20px;}
  .group > label{display:block; font-size:12px; color:var(--dim); margin-bottom:8px; letter-spacing:.3px;}
  .hint{font-size:11px; color:var(--dim); margin-top:6px; line-height:1.5;}
  .btn{
    width:100%; padding:9px; margin-bottom:8px; border:1px solid var(--line);
    background:#161c26; color:var(--txt); border-radius:6px; cursor:pointer;
    font-size:13px; transition:.15s;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.active{background:var(--accent); color:#04140a; border-color:var(--accent); font-weight:600;}
  .btn.rec{background:#2a0d12; border-color:#ff3b3b; color:#ff8a8a;}
  .btn.rec:hover{color:#ffd0d0;}
  .btn.rec.active{background:#ff3b3b; color:#fff; border-color:#ff3b3b; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  select, input[type=range], input[type=text]{width:100%;}
  select{
    padding:8px; background:#161c26; color:var(--txt);
    border:1px solid var(--line); border-radius:6px; font-size:13px;
  }
  #textInput{
    padding:9px; background:#161c26; color:var(--txt);
    border:1px solid var(--line); border-radius:6px; font-size:13px; margin-bottom:4px;
  }
  #textInput:focus{outline:none; border-color:var(--accent); color:var(--accent);}
  input[type=range]{accent-color:var(--accent);}
  .play-btns{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .play-btns .btn{margin-bottom:0; font-size:12px; padding:9px 4px;}
  .row{display:flex; align-items:center; justify-content:space-between; font-size:12px; color:var(--dim);}
  .toggle{display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; user-select:none;}
  .toggle input{accent-color:var(--accent); width:16px; height:16px;}
  .placeholder{
    color:var(--dim); font-size:13px; text-align:center; line-height:1.8; max-width:340px;
  }
  .placeholder code{color:var(--accent);}
  .status{position:absolute; left:24px; bottom:18px; font-size:11px; color:var(--dim); background:rgba(10,14,20,.6); padding:3px 8px; border-radius:4px;}
  footer{
    text-align:center; padding:14px; color:var(--dim); font-size:12px;
    border-top:1px solid var(--line);
  }
  footer a{color:var(--accent); text-decoration:none;}
  footer a:hover{text-decoration:underline;}
  @media (max-width:760px){
    .wrap{flex-direction:column; min-height:0;}
    .panel{width:100%; flex:none; border-right:none; border-bottom:1px solid var(--line); max-height:none;}
    .stage{min-height:46vh; padding:12px;}
    header h1{font-size:13px;}
  }
</style>
</head>
<body>
<header>
  <div class="left">
    <a class="back" href="/">← 首页</a>
    <h1>视频转字符艺术 <span>// ASCII Video</span></h1>
  </div>
  <span class="badge">纯前端 · 实时</span>

<div class="wrap">
  <div class="panel">
    <div class="group">
      <label>① 内置演示玩法（打开即玩）</label>
      <div class="play-btns">
        <button class="btn" data-play="orbit">✨ 光环</button>
        <button class="btn" data-play="text">🔤 文字</button>
        <button class="btn" data-play="fireworks">🎆 烟花</button>
        <button class="btn" data-play="interactive">👆 画笔</button>
        <button class="btn" data-play="glitch">👾 故障</button>
      </div>
      <input type="text" id="textInput" maxlength="14" placeholder="文字动画里输入：如 你好 FreeNav" value="FreeNav">
      <div class="hint">👆 鼠标/手指移到画面＝手电筒，字符跟着亮。烟花模式点画面放；画笔模式拖动留轨迹；故障模式每帧随机抖动。移动就有互动。</div>
    </div>

    <div class="group">
      <label>② 视频源（换成你自己的画面）</label>

      <div class="hint">想转你自己的视频/自拍？授权摄像头或上传视频即可。</div>
    </div>

    <div class="group">
      <label>③ 字符集</label>
      <select id="charset">
        <option value="standard">标准 ASCII</option>

    <div class="group">

        <option value="color">彩色模式</option>

        <option value="amber">复古琥珀</option>

    <div class="group">
      <label>⑤ 字符密度 <span id="densityVal" style="float:right;color:var(--accent)">120 列</span></label>

    <div class="group">
      <label>⑥ 帧率 <span id="fpsVal" style="float:right;color:var(--accent)">24 FPS</span></label>

    <div class="group">

    </div>

    <div class="group">
      <label>⑧ 操作 / 导出</label>
      <button class="btn" id="pauseBtn">⏸ 暂停</button>
      <button class="btn" id="shotBtn">📸 截图保存</button>
      <button class="btn" id="copyBtn">📋 复制文本</button>
      <button class="btn" id="shareBtn">📣 保存分享图</button>
      <button class="btn rec" id="recBtn">🎬 录表情包 GIF</button>
      <div class="hint">「录表情包 GIF」会录 3 秒画面，自动在右下角打 freenav.net 水印，导出就能当表情包发群/朋友圈——强引流。</div>
    </div>
  </div>

  <div class="stage">
    <canvas id="display"></canvas>
    <div class="placeholder" id="placeholder">
      正在加载内置演示…<br>
      也可选择 <code>摄像头</code> 或 <code>上传视频</code>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>

<footer>
  视频转字符艺术 · 纯前端实时转换 · 免费工具由 <a href="/">FreeNav</a> 提供
</footer>

<script>
(function(){
  const video = document.createElement('video');
  video.muted = true; video.playsInline = true; video.loop = true;

  const srcCanvas = document.createElement('canvas');
  const srcCtx = srcCanvas.getContext('2d', {willReadFrequently:true});
  const display = document.getElementById('display');
  const dctx = display.getContext('2d');
  const placeholder = document.getElementById('placeholder');
  const statusEl = document.getElementById('status');
  const pauseBtn = document.getElementById('pauseBtn');

  // 内置演示离屏画布（自带动画，无需任何外部素材）
  const demoCanvas = document.createElement('canvas');
  demoCanvas.width = 240; demoCanvas.height = 180;
  const demoCtx = demoCanvas.getContext('2d');
  let demoT = 0;

  const CHARSETS = {
    standard: ' .:-=+*#%@',
    dense:    ' ░▒▓█',
    chinese: ' 　丶丿一十土王玨珏',
    binary:  ' 01',
  };
  const FONT_PX = 8;
  const CHAR_W = FONT_PX * 0.6;   // monospace 宽高比
  const CHAR_H = FONT_PX;

  let cols = 120, rows = 0;
  let charSet = CHARSETS.standard;
  let colorMode = 'color';
  let invert = false;
  let lightBg = false;
  let fps = 24;
  let running = false;
  let paused = false;
  let source = null;            // 'video' | 'demo' | null
  let demoMode = 'orbit';       // orbit | text | fireworks | interactive | glitch
  let last = 0, rafId = null;
  let lastText = '';

  // 指针（鼠标/触摸）状态——映射到 demoCanvas 坐标系
  const pointer = {x:demoCanvas.width/2, y:demoCanvas.height/2, active:false, down:false};
  let trail = [];               // 光球画笔轨迹 {x,y,life}
  let fwParticles = [];         // 烟花粒子

  // ---- GIF 表情包导出 ----
  const REC_W = 300, REC_FPS = 12, REC_SECONDS = 3, REC_MAX = REC_FPS * REC_SECONDS;
  const recCanvas = document.createElement('canvas');
  const recCtx = recCanvas.getContext('2d');
  let recording = false, gifFrames = [], recW = 0, recH = 0, recStart = 0;
  // 固定全局调色板：黑 + Web-safe 216 色（字符艺术颜色少，最近色映射足够，无需动态量化）
  const PALETTE = [[0,0,0]];
  for(let r=0;r<256;r+=51) for(let g=0;g<256;g+=51) for(let b=0;b<256;b+=51) PALETTE.push([r,g,b]);
  const _nearCache = new Map();
  function nearest(r,g,b){
    const key = (r<<16)|(g<<8)|b;
    const c = _nearCache.get(key);
    if(c !== undefined) return c;
    let best = 0, bd = 1e9;
    for(let i=0;i<PALETTE.length;i++){
      const p = PALETTE[i], dr=r-p[0], dg=g-p[1], db=b-p[2], d=dr*dr+dg*dg+db*db;
      if(d<bd){ bd=d; best=i; }
    }
    _nearCache.set(key, best);
    return best;
  }
  function lzwEncode(minCodeSize, indices){
    const clearCode = 1<<minCodeSize, eoiCode = clearCode+1;
    let codeSize = minCodeSize+1, nextCode = eoiCode+1;
    let dict = new Map();
    const resetDict = ()=>{ dict = new Map(); for(let i=0;i<clearCode;i++) dict.set(i, i); };
    resetDict();
    const bytes = []; let cur = 0, curBits = 0;
    const writeCode = (code, size)=>{
      cur |= (code << curBits); curBits += size;
      while(curBits >= 8){ bytes.push(cur & 0xff); cur >>= 8; curBits -= 8; }
    };
    writeCode(clearCode, codeSize);
    let prefix = indices[0];
    for(let i=1;i<indices.length;i++){
      const k = indices[i];
      const combined = (dict.has(prefix) ? dict.get(prefix) : prefix) + '_' + k;
      if(dict.has(combined)){
        prefix = combined;
      } else {
        const pc = dict.has(prefix) ? dict.get(prefix) : prefix;
        writeCode(pc, codeSize);
        if(nextCode < 4096){
          dict.set(combined, nextCode); nextCode++;
          if(nextCode === (1<<codeSize) && codeSize < 12) codeSize++;
        } else {
          writeCode(clearCode, codeSize); resetDict(); nextCode = eoiCode+1; codeSize = minCodeSize+1;
        }
        prefix = k;
      }
    }
    const pc = dict.has(prefix) ? dict.get(prefix) : prefix;
    writeCode(pc, codeSize);
    writeCode(eoiCode, codeSize);
    if(curBits > 0) bytes.push(cur & 0xff);
    return bytes;
  }
  function gifEncode(w, h, frames, palette, delayCs){
    const out = [];
    const p = (...b)=>{ for(const x of b) out.push(x & 0xff); };
    'GIF89a'.split('').forEach(c=> p(c.charCodeAt(0)));
    p(w&0xff,(w>>8)&0xff, h&0xff,(h>>8)&0xff, 0xF7, 0, 0); // 逻辑屏幕描述符 + 全局色表标志(256)
    for(let i=0;i<256;i++){ const c = palette[i] || [0,0,0]; p(c[0],c[1],c[2]); }
    p(0x21,0xFF,0x0B); 'NETSCAPE2.0'.split('').forEach(c=> p(c.charCodeAt(0))); p(0x03,0x01,0x00,0x00,0x00);
    for(const f of frames){
      p(0x21,0xF9,0x04,0x04, delayCs&0xff,(delayCs>>8)&0xff, 0x00, 0x00); // 图形控制扩展
      p(0x2C, 0,0,0,0, w&0xff,(w>>8)&0xff, h&0xff,(h>>8)&0xff, 0x00);     // 图像描述符
      p(8); // LZW 最小码长
      const lzw = lzwEncode(8, f);
      let i = 0;
      while(i < lzw.length){ const n = Math.min(255, lzw.length-i); p(n); for(let k=0;k<n;k++) p(lzw[i+k]); i += n; }
      p(0x00);
    }
    p(0x3B);
    return new Uint8Array(out);
  }
  function captureFrame(){
    const dw = display.width, dh = display.height;
    if(dw === 0 || dh === 0) return;
    const rw = REC_W, rh = Math.max(1, Math.round(REC_W * dh / dw));
    recCanvas.width = rw; recCanvas.height = rh;
    recCtx.drawImage(display, 0, 0, rw, rh);
    // 右下角 freenav.net 水印（半透明底 + 绿字），实时画面不受影响
    recCtx.font = 'bold 13px monospace';
    recCtx.textBaseline = 'bottom';
    const txt = 'freenav.net';
    const tw = recCtx.measureText(txt).width;
    recCtx.fillStyle = 'rgba(0,0,0,0.45)';
    recCtx.fillRect(rw - tw - 10, rh - 18, tw + 8, 16);
    recCtx.fillStyle = '#00ff41';
    recCtx.fillText(txt, rw - tw - 6, rh - 4);
    const data = recCtx.getImageData(0,0,rw,rh).data;
    const idx = new Uint8Array(rw*rh);
    for(let i=0,pp=0;i<idx.length;i++,pp+=4) idx[i] = nearest(data[pp],data[pp+1],data[pp+2]);
    gifFrames.push(idx); recW = rw; recH = rh;
  }

  function setStatus(t){ statusEl.textContent = t; }

  // 统一配置画布尺寸（视频或演示都走这里）；关键：锁死显示宽高比，密度变化不再变形
  function configure(vw, vh){
    rows = Math.max(1, Math.round(cols * (vh/vw) * (CHAR_W/CHAR_H)));
    srcCanvas.width = cols; srcCanvas.height = rows;
    display.width = Math.round(cols * CHAR_W);
    display.height = Math.round(rows * CHAR_H);
    display.style.aspectRatio = (cols*CHAR_W) + ' / ' + (rows*CHAR_H); // 修复"密度变窄"
    placeholder.style.display = 'none';
    running = true; paused = false;
    pauseBtn.textContent = '⏸ 暂停';
    if(!rafId) loop();
  }

  // ---- 内置演示：5 种可互动玩法 ----
  function drawDemo(){
    const w = demoCanvas.width, h = demoCanvas.height, c = demoCtx;

    if(demoMode === 'fireworks'){
      c.fillStyle = 'rgba(0,0,0,0.28)'; c.fillRect(0,0,w,h);   // 拖尾
    } else {
      c.fillStyle = '#000'; c.fillRect(0,0,w,h);
    }

    if(demoMode === 'orbit'){
      drawOrbit(c, w, h);
    } else if(demoMode === 'text'){
      drawTextMode(c, w, h);
    } else if(demoMode === 'fireworks'){
      drawFireworks(c);
    } else if(demoMode === 'interactive'){
      drawInteractive(c, w, h);
    } else if(demoMode === 'glitch'){
      drawGlitch(c, w, h);
    }

    // 鼠标手电筒：非烟花模式叠加，移动即有互动
    if(pointer.active && demoMode !== 'fireworks'){
      const g = c.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, 64);
      g.addColorStop(0, 'rgba(255,255,255,0.85)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.fillRect(0,0,w,h);
    }
  }

  function drawOrbit(c, w, h){
    const cx = w/2, cy = h/2, R = Math.min(w,h)*0.34;
    for(let k=0;k<26;k++){
      const a = demoT*0.0012 + k*(Math.PI*2/26);
      const rr = R*(1 + 0.16*Math.sin(demoT*0.003 + k));
      const x = cx + Math.cos(a)*rr, y = cy + Math.sin(a)*rr;
      const g = c.createRadialGradient(x,y,0,x,y,7);
      g.addColorStop(0,'rgba(0,255,120,1)'); g.addColorStop(1,'rgba(0,255,120,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x,y,7,0,Math.PI*2); c.fill();
    }
    const orbs = [{c:'255,80,80'},{c:'80,160,255'},{c:'255,210,0'},{c:'200,120,255'}];
    orbs.forEach((o,i)=>{
      const ox = (0.5 + 0.4*Math.sin(demoT*0.0009 + i*2.1))*w;
      const oy = (0.5 + 0.36*Math.sin(demoT*0.0013 + i*1.3))*h;
      const r  = 20 + 7*Math.sin(demoT*0.004 + i);
      const g = c.createRadialGradient(ox,oy,0,ox,oy,r);
      g.addColorStop(0,'rgba('+o.c+',1)'); g.addColorStop(1,'rgba('+o.c+',0)');
      c.fillStyle = g; c.beginPath(); c.arc(ox,oy,r,0,Math.PI*2); c.fill();
    });
  }

  function drawTextMode(c, w, h){
    const txt = (document.getElementById('textInput').value || 'FreeNav').slice(0,14);
    const breathe = 1 + 0.07*Math.sin(demoT*0.002);
    const fs = Math.min(56, Math.floor((w*0.9) / Math.max(1, txt.length) * 1.7));
    c.save();
    c.translate(w/2, h/2 + 4*Math.sin(demoT*0.0015));
    c.scale(breathe, breathe);
    c.fillStyle = '#fff';
    c.font = 'bold ' + fs + 'px sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(txt, 0, 0);
    c.restore();
    const rr = 20 + 16*Math.sin(demoT*0.0018);
    c.strokeStyle = 'rgba(0,255,120,0.5)'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(w/2, h/2, 64 + rr, 0, Math.PI*2); c.stroke();
  }

  function spawnFirework(x, y){
    const n = 46, hue = Math.floor(Math.random()*360);
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp = 0.6 + Math.random()*3.2;
      fwParticles.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.2, life:1, hue});
    }
  }
  function drawFireworks(c){
    for(let i=fwParticles.length-1;i>=0;i--){
      const p = fwParticles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.07; p.life -= 0.012;
      if(p.life <= 0 || p.y > demoCanvas.height + 12){ fwParticles.splice(i,1); continue; }
      c.fillStyle = 'hsla('+p.hue+',100%,'+(50+p.life*35)+'%,'+p.life+')';
      c.beginPath(); c.arc(p.x, p.y, 2, 0, Math.PI*2); c.fill();
    }
  }

  function drawInteractive(c, w, h){
    c.fillStyle = 'rgba(0,0,0,0.16)'; c.fillRect(0,0,w,h);
    for(let k=0;k<5;k++){
      const x = (0.5 + 0.42*Math.sin(demoT*0.0006 + k*1.7))*w;
      const y = (0.5 + 0.40*Math.cos(demoT*0.0008 + k*2.3))*h;
      const g = c.createRadialGradient(x,y,0,x,y,10);
      g.addColorStop(0,'rgba(0,255,120,0.5)'); g.addColorStop(1,'rgba(0,255,120,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x,y,10,0,Math.PI*2); c.fill();
    }
    if(pointer.down){ trail.push({x:pointer.x, y:pointer.y, life:1}); }
    trail.forEach(t=>{
      t.life -= 0.025;
      if(t.life > 0){
        const g = c.createRadialGradient(t.x,t.y,0,t.x,t.y,13);
        g.addColorStop(0,'rgba(0,255,120,'+t.life+')');
        g.addColorStop(1,'rgba(0,255,120,0)');
        c.fillStyle = g; c.beginPath(); c.arc(t.x,t.y,13,0,Math.PI*2); c.fill();
      }
    });
    trail = trail.filter(t=> t.life > 0);
    if(pointer.active){
      const g = c.createRadialGradient(pointer.x,pointer.y,0,pointer.x,pointer.y,22);
      g.addColorStop(0,'rgba(255,255,255,0.95)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle = g; c.beginPath(); c.arc(pointer.x,pointer.y,22,0,Math.PI*2); c.fill();
    }
  }

  // 故障艺术：基于光环内容，随机水平切片错位 + 偶发 RGB 通道交换
  function drawGlitch(c, w, h){
    drawOrbit(c, w, h);
    const img = c.getImageData(0,0,w,h);
    const d = img.data;
    const slices = 3 + (Math.random()*4|0);
    for(let s=0;s<slices;s++){
      const y0 = (Math.random()*h)|0;
      const hgt = 2 + (Math.random()*10|0);
      const off = (Math.random()*30 - 15)|0;
      for(let y=y0; y<Math.min(h,y0+hgt); y++){
        const rs = y*w*4;
        for(let x=0;x<w;x++){
          const sx = ((x+off)%w + w) % w;
          const si = rs + sx*4;
          d[rs+x*4] = d[si]; d[rs+x*4+1] = d[si+1]; d[rs+x*4+2] = d[si+2];
        }
      }
    }
    if(Math.random() < 0.4){
      for(let i=0;i<d.length;i+=4){ const r = d[i]; d[i] = d[i+2]; d[i+2] = r; }
    }
    c.putImageData(img, 0, 0);
  }

  function drawFrame(){
    if(source === 'video' && video.videoWidth){
      srcCtx.drawImage(video, 0, 0, cols, rows);
    } else if(source === 'demo'){
      drawDemo();
      srcCtx.drawImage(demoCanvas, 0, 0, cols, rows);
    } else {
      return;
    }
    const data = srcCtx.getImageData(0, 0, cols, rows).data;

    dctx.fillStyle = lightBg ? '#f5f5f5' : '#000';
    dctx.fillRect(0, 0, display.width, display.height);
    dctx.font = FONT_PX + 'px monospace';
    dctx.textBaseline = 'top';

    const len = charSet.length;
    let text = [];
    for(let y=0; y<rows; y++){
      let line = '';
      for(let x=0; x<cols; x++){
        const i = (y*cols + x) * 4;
        let r = data[i], g = data[i+1], b = data[i+2];
        let lum = 0.299*r + 0.587*g + 0.114*b;
        if(invert) lum = 255 - lum;
        let ch = charSet[Math.floor(lum/256 * len)] || ' ';
        line += ch;
        if(colorMode === 'color'){
          dctx.fillStyle = 'rgb('+r+','+g+','+b+')';
        } else if(colorMode === 'matrix'){
          dctx.fillStyle = '#00ff41';
        } else if(colorMode === 'amber'){
          dctx.fillStyle = '#ffb000';
        } else if(colorMode === 'neon'){
          dctx.fillStyle = 'rgb('+Math.min(255,lum+40)+','+(lum<128?255:80)+','+Math.min(255,255-(lum*0.4))+')';
        } else {
          dctx.fillStyle = lightBg ? '#222' : '#ddd';
        }
        dctx.fillText(ch, x*CHAR_W, y*CHAR_H);
      }
      text.push(line);
    }
    lastText = text.join('\n');
  }

  function loop(){
    rafId = requestAnimationFrame(loop);
    if(!running || paused) return;
    const now = performance.now();
    if(source === 'demo') demoT = now;          // 演示动画始终按真实时间推进
    if(now - last >= 1000/fps){
      last = now;
      drawFrame();
      // 录制：按 REC_FPS 抓帧
      if(recording){
        const elapsed = now - recStart;
        const target = Math.floor(elapsed/1000*REC_FPS);
        if(gifFrames.length < target && gifFrames.length < REC_MAX){
          captureFrame();
          setStatus('录制中 ' + Math.min(100, Math.round(gifFrames.length/REC_MAX*100)) + '%');
        }
        if(gifFrames.length >= REC_MAX || elapsed > (REC_MAX/REC_FPS*1000) + 800){
          finishRecording();
        }
      }
    }
  }

  function finishRecording(){
    recording = false;
    document.getElementById('recBtn').classList.remove('active');
    if(gifFrames.length === 0){ setStatus('没录到画面（先取消暂停）'); return; }
    setStatus('编码 GIF 中…');
    setTimeout(()=>{
      const gif = gifEncode(recW, recH, gifFrames, PALETTE, Math.round(100/REC_FPS));
      const blob = new Blob([gif], {type:'image/gif'});
      const a = document.createElement('a');
      a.download = 'ascii-meme-' + Date.now() + '.gif';
      a.href = URL.createObjectURL(blob);
      a.click();
      setStatus('表情包 GIF 已保存（带 freenav.net 水印）');
      gifFrames = [];
    }, 30);
  }

  // 切换到内置演示 + 指定玩法
  function startDemo(mode){
    video.srcObject = null; video.pause();
    source = 'demo';
    demoMode = mode;
    document.querySelectorAll('.play-btns .btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.play === mode);
    });
    document.getElementById('camBtn').classList.remove('active');
    document.getElementById('fileBtn').classList.remove('active');
    configure(demoCanvas.width, demoCanvas.height);
    const names = {orbit:'光环', text:'文字动画', fireworks:'烟花（点画面放）', interactive:'光球画笔（拖动画画）', glitch:'故障艺术'};
    setStatus('内置演示：' + names[mode]);
  }

  document.querySelectorAll('.play-btns .btn').forEach(b=>{
    b.addEventListener('click', ()=> startDemo(b.dataset.play));
  });

  document.getElementById('textInput').addEventListener('input', ()=>{ lastText=''; });

  // 指针坐标 → demoCanvas 坐标
  function toDemoCoords(clientX, clientY){
    const r = display.getBoundingClientRect();
    if(r.width === 0) return {x:pointer.x, y:pointer.y};
    return {
      x: (clientX - r.left) / r.width * demoCanvas.width,
      y: (clientY - r.top) / r.height * demoCanvas.height
    };
  }
  display.addEventListener('pointermove', e=>{
    const p = toDemoCoords(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  });
  display.addEventListener('pointerdown', e=>{
    const p = toDemoCoords(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true; pointer.down = true;
    if(demoMode === 'fireworks' && source === 'demo') spawnFirework(p.x, p.y);
  });
  window.addEventListener('pointerup', ()=>{ pointer.down = false; });
  display.addEventListener('pointerleave', ()=>{ pointer.active = false; pointer.down = false; });

  // 源：摄像头
  document.getElementById('camBtn').addEventListener('click', async function(){
    document.querySelectorAll('.play-btns .btn').forEach(b=> b.classList.remove('active'));
    try{
      const s = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      video.srcObject = s;
      await video.play();
      source = 'video';
      this.classList.add('active');
      configure(video.videoWidth, video.videoHeight);
      setStatus('摄像头运行中');
    }catch(e){
      setStatus('摄像头打开失败：' + e.message);
    }
  });

  // 源：上传
  const fileInput = document.getElementById('fileInput');
  document.getElementById('fileBtn').addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', function(e){
    const f = e.target.files[0];
    if(!f) return;
    document.querySelectorAll('.play-btns .btn').forEach(b=> b.classList.remove('active'));
    video.srcObject = null;
    video.src = URL.createObjectURL(f);
    video.onloadeddata = ()=>{ video.play(); source='video'; configure(video.videoWidth, video.videoHeight); setStatus('视频：' + f.name); };
  });

  // 控件
  document.getElementById('charset').addEventListener('change', e=>{
    charSet = CHARSETS[e.target.value] || CHARSETS.standard; lastText='';
  });
  document.getElementById('colorMode').addEventListener('change', e=>{
    colorMode = e.target.value; lastText='';
  });
  const density = document.getElementById('density');
  density.addEventListener('input', e=>{
    cols = +e.target.value;
    document.getElementById('densityVal').textContent = cols + ' 列';
    if(source){
      const vw = source==='video' ? video.videoWidth : demoCanvas.width;
      const vh = source==='video' ? video.videoHeight : demoCanvas.height;
      configure(vw, vh);
    }
  });
  const fpsEl = document.getElementById('fps');
  fpsEl.addEventListener('input', e=>{
    fps = +e.target.value;
    document.getElementById('fpsVal').textContent = fps + ' FPS';
  });
  document.getElementById('invert').addEventListener('change', e=> invert = e.target.checked);
  document.getElementById('lightBg').addEventListener('change', e=> lightBg = e.target.checked);

  document.getElementById('pauseBtn').addEventListener('click', function(){
    paused = !paused;
    this.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  });
  document.getElementById('shotBtn').addEventListener('click', ()=>{
    if(!running){ setStatus('还没有可截图的画面'); return; }
    const a = document.createElement('a');
    a.download = 'ascii-' + Date.now() + '.png';
    a.href = display.toDataURL('image/png');
    a.click();
    setStatus('截图已保存');
  });
  document.getElementById('copyBtn').addEventListener('click', async ()=>{
    if(!lastText){ setStatus('还没有可复制的文本'); return; }
    try{
      await navigator.clipboard.writeText(lastText);
      setStatus('字符文本已复制到剪贴板');
    }catch(e){
      setStatus('复制失败（浏览器限制），可手动截图');
    }
  });
  document.getElementById('shareBtn').addEventListener('click', ()=>{
    if(!running){ setStatus('还没有可分享的画面'); return; }
    const bar = 36;
    const oc = document.createElement('canvas');
    oc.width = display.width; oc.height = display.height + bar;
    const o = oc.getContext('2d');
    o.drawImage(display, 0, 0);
    o.fillStyle = '#0a0e14'; o.fillRect(0, display.height, oc.width, bar);
    o.textBaseline = 'middle';
    o.fillStyle = '#00ff41'; o.font = 'bold 16px monospace'; o.textAlign = 'left';
    o.fillText('freenav.net · 视频转字符艺术', 14, display.height + bar/2);
    o.fillStyle = '#6b7888'; o.font = '12px monospace'; o.textAlign = 'right';
    o.fillText('免费在线玩 → freenav.net', oc.width - 14, display.height + bar/2);
    const a = document.createElement('a');
    a.download = 'ascii-share-' + Date.now() + '.png';
    a.href = oc.toDataURL('image/png');
    a.click();
    setStatus('分享图已保存（带 freenav.net 水印）');
  });
  // 录表情包 GIF
  const recBtn = document.getElementById('recBtn');
  recBtn.addEventListener('click', ()=>{
    if(!running){ setStatus('先打开演示或视频再录'); return; }
    if(paused){ setStatus('请先取消暂停再录'); return; }
    if(recording){ return; }
    recording = true; gifFrames = []; recStart = performance.now();
    recBtn.classList.add('active');
    setStatus('录制中 0%');
  });

  // 页面加载即自动播放内置演示（默认光环），最大化停留与消遣
  window.addEventListener('DOMContentLoaded', ()=>{
    startDemo('orbit');
  });
})();
</script>
</body>
</html>
